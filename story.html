<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex,nofollow,noarchive">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zcrypt</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@500&display=swap" rel="stylesheet">
<style>
:root{--band:#0E398A;--acc:#5A71D6;--ink:#1D2133;--soft:#5B6178;--pale:#C9D3FF;--ok:#1E6A43;--okbg:#E6F2EA;--bad:#B3261E;--badbg:#FBE9E7;--rule:#DCDFEA}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"IBM Plex Sans",-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);background:#fff;overflow:hidden}
h1,h2,.mark{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",Arial,sans-serif}
#stage{position:fixed;inset:0;display:grid;grid-template-columns:minmax(320px,440px) minmax(320px,620px);gap:6vw;align-items:center;justify-content:center;padding:90px 48px 90px;transition:background .6s}
#stage.blue{background:var(--band);color:#fff}
.ros{position:fixed;width:min(80vh,760px);height:min(80vh,760px);right:-14vh;top:-18vh;opacity:0;transition:opacity .8s;pointer-events:none}
.blue ~ .ros,.ros.on{opacity:.35}
.ros path{stroke:#fff;stroke-width:.35}.ros .g2,.ros .g4{stroke:#C9D3FF}.ros .rim{stroke:#fff;stroke-width:.4}.ros svg{width:100%;height:100%}
.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:26px 48px;z-index:5}
.mark{font-weight:700;font-size:22px;color:var(--band);transition:color .6s}
.part{font-size:14px;color:var(--soft);transition:color .6s}
body.inv .mark{color:#fff}body.inv .part{color:var(--pale)}
/* phone */
.phone{width:300px;height:610px;margin:auto;border-radius:46px;background:#fff;border:11px solid #1B2440;box-shadow:0 30px 60px rgba(14,57,138,.18);position:relative;overflow:hidden;transition:transform .7s ease}
.phone:before{content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);width:84px;height:22px;background:#1B2440;border-radius:12px;z-index:3}
.screen{position:absolute;inset:0;padding:50px 16px 18px;display:flex;flex-direction:column;gap:11px;background:#F4F6FB}
.bar{font-size:12px;font-weight:600;color:var(--soft);text-align:center;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.msg{background:#fff;border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:12.5px;line-height:1.5;box-shadow:0 1px 0 #DDE2EE;opacity:0;transform:translateY(8px);transition:all .5s}
.msg.in{opacity:1;transform:none}
.fw{display:block;color:var(--soft);font-size:10.5px;font-style:italic;margin-bottom:3px}
.res{border-radius:14px;padding:14px;opacity:0;transform:scale(.97);transition:all .5s}
.res.in{opacity:1;transform:none}
.res.ok{background:var(--okbg);color:var(--ok)}.res.bad{background:var(--badbg);color:var(--bad)}
.res b{display:block;font-size:17px;margin-bottom:4px}.res p{font-size:12px;color:var(--ink);line-height:1.5}
.res del{background:#F6D3CF;color:#7E1A14;padding:0 3px;border-radius:3px}.res ins{text-decoration:none;background:#D7EEDF;color:#14492E;padding:0 3px;border-radius:3px}
.doc{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 0 #DDE2EE;opacity:0;transform:translateY(8px);transition:all .5s}
.doc.in{opacity:1;transform:none}
.doc i{width:34px;height:34px;border-radius:9px;background:#E6EBFA;display:grid;place-items:center;flex:none}
.doc i svg{width:18px;height:18px;stroke:var(--band);fill:none;stroke-width:1.8}
.doc b{font-size:13px;display:block}.doc small{font-size:11px;color:var(--soft)}
.note{margin-top:auto;text-align:center;font-size:12px;font-weight:600;color:var(--band);opacity:0;transition:opacity .5s}.note.in{opacity:1}
.hex{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;line-height:1.6;color:#8A93AE;word-break:break-all;background:#fff;border-radius:12px;padding:12px;min-height:220px}
.crack{position:absolute;inset:0;z-index:2;opacity:0;transition:opacity .4s;background:
 linear-gradient(115deg,transparent 48%,rgba(255,255,255,.55) 49%,transparent 50%),
 linear-gradient(35deg,transparent 58%,rgba(255,255,255,.4) 59%,transparent 60%),
 linear-gradient(160deg,transparent 38%,rgba(255,255,255,.35) 39%,transparent 40%),#0A0F1E}
.crack.in{opacity:1}
.ring{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 10px;margin-top:22px;justify-items:center}
.p{width:58px;height:58px;border-radius:50%;background:#fff;border:2px solid var(--rule);display:grid;place-items:center;font-weight:600;color:var(--soft);transition:all .5s}
.p.on{border-color:var(--band);background:var(--band);color:#fff}
.lbl{font-size:10.5px;color:var(--soft);text-align:center;margin-top:5px}
.count{text-align:center;font:700 26px/1 "IBM Plex Sans Condensed",Arial,sans-serif;color:var(--band);margin-top:18px}
.cert{background:#fff;border-radius:12px;padding:14px;font-size:12px;line-height:1.6;box-shadow:0 1px 0 #DDE2EE}
.cert b{font-size:13px}
.seal-big{display:grid;place-items:center;margin-top:30px}
.seal-big svg{width:220px;height:220px}
.seal-big path{stroke:var(--band);stroke-width:.5}.seal-big .rim{stroke:var(--band);stroke-width:.6}
/* copy */
.copy{max-width:600px}
.kicker{font-size:15px;font-weight:600;color:var(--acc);margin-bottom:16px}
body.inv .kicker{color:var(--pale)}
.copy h1{font-size:clamp(36px,4.4vw,62px);line-height:1.04;font-weight:700;color:var(--band);margin-bottom:22px}
body.inv .copy h1{color:#fff}
.copy p{font-size:clamp(17px,1.55vw,22px);line-height:1.55;color:#3A4060;max-width:36ch}
body.inv .copy p{color:#DCE3FF}
.copy .ar{font-family:"IBM Plex Sans Arabic",Arial,sans-serif;direction:rtl;text-align:left;font-size:26px;color:var(--pale);margin:-6px 0 18px}
.copy .cta{margin-top:26px;font-size:16px;font-weight:600;color:#fff}
.fade{animation:fade .7s ease both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.foot{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:24px 48px;font-size:13px;color:var(--soft);z-index:5}
body.inv .foot{color:var(--pale)}
.dots{display:flex;gap:6px}.dots b{width:26px;height:3px;border-radius:2px;background:var(--rule);transition:background .3s}
body.inv .dots b{background:rgba(255,255,255,.25)}
.dots b.on{background:var(--acc)}body.inv .dots b.on{background:#fff}
@media (max-width:900px){#stage{grid-template-columns:1fr;gap:18px;padding:80px 24px 80px;overflow:auto}.phone{transform:scale(.78)}.copy{text-align:left}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div id="stage"><div><div class="phone" id="phone"><div class="crack" id="crack"></div><div class="screen" id="screen"></div></div></div><div class="copy" id="copy"></div></div>

 { part:"Part one: verifying what people receive", kicker:"The problem",
   h:"Two evacuation notices. Only one is real.",
   p:"In a crisis, a forged notice spreads as quickly as a genuine one, and looks identical.",
   phone:()=>`<div class="bar">Family group</div>
     <div class="msg"><span class="fw">Forwarded</span><b>North District Relief Office</b><br>${NOTICE_REAL}</div>
     <div class="msg"><span class="fw">Forwarded many times</span><b>North District Relief Office</b><br>Buses to the safe zone leave from the Old Bridge at 9:00 on Friday.</div>`,
   anim:()=>stagger(".msg",700) },
 { part:"Part one: verifying what people receive", kicker:"The seal",
   h:"The genuine notice carries a seal.",
   p:"The issuing office seals it once. However many times it is forwarded, anyone can confirm who issued it and that nothing has changed.",
   phone:()=>`<div class="bar">Zcrypt check</div>
     <div class="msg in">${NOTICE_REAL}</div>
     <div class="res ok" id="r"><b>Genuine and unchanged</b><p>Sealed by North District Relief Office.</p></div>`,
   anim:()=>later("#r",1100) },
 { part:"Part one: verifying what people receive", kicker:"The forgery",
   h:"One altered word is enough to fail.",
   p:"The forged copy is rejected, and Zcrypt shows exactly what the original notice said.",
   phone:()=>`<div class="bar">Zcrypt check</div>
     <div class="msg in">Buses to the safe zone leave from the Old Bridge at 9:00 on Friday.</div>
     <div class="res bad" id="r"><b>Altered. Do not act on it.</b><p>Leave from <del>the Old Bridge</del> <ins>North School</ins> at 9:00 on Friday.</p></div>`,
   anim:()=>later("#r",1100) },
 { part:"Part two: protecting what people carry", kicker:"Zcrypt Vault",
   h:"Amal, 17, has to leave home.",
   p:"Her school certificate, birth certificate and family record are stored in a vault on her own phone, encrypted with her passphrase.",
   phone:()=>`<div class="bar">Amal's vault</div>
     <div class="doc"><i>${I.cert}</i><div><b>School certificate</b><small>Grade 11, 2026</small></div></div>
     <div class="doc"><i>${I.id}</i><div><b>Birth certificate</b><small>Original scan</small></div></div>
     <div class="doc"><i>${I.fam}</i><div><b>Family record</b><small>Three members</small></div></div>
     <div class="note" id="n">Encrypted on this phone</div>`,
   anim:()=>{stagger(".doc",450);later("#n",1800)} },
 { part:"Part two: protecting what people carry", kicker:"The backup",
   h:"A backup no one else can read.",
   p:"An aid organisation holds an encrypted copy it cannot open. If it is ever breached or pressured, there is nothing usable to take.",
   phone:()=>`<div class="bar">What the organisation stores</div><div class="hex" id="hex"></div><div class="note in">No name. No documents. No key.</div>`,
   anim:()=>hexRain() },
 { part:"Part two: protecting what people carry", kicker:"The loss",
   h:"Her phone is lost at a crossing.",
   p:"Ordinarily, this is where her documents would be gone for good.",
   phone:()=>`<div class="bar">Amal's vault</div>
     <div class="doc in"><i>${I.cert}</i><div><b>School certificate</b></div></div>
     <div class="doc in"><i>${I.id}</i><div><b>Birth certificate</b></div></div>`,
   anim:()=>setTimeout(()=>{crack.classList.add("in");phone.style.transform="rotate(-4deg)"},900) },
 { part:"Part two: protecting what people carry", kicker:"The recovery",
   h:"Three people she trusts restore it.",
   p:"Amal chose five people. Any three together can recover her vault on a new phone. No single person, and no office, can do it alone.",
   phone:()=>`<div class="bar">New phone: recovery</div>
     <div class="ring">${[["T","Teacher"],["A","Aunt"],["C","Caseworker"],["F","Friend"],["N","Neighbour"]].map(x=>`<div><div class="p">${x[0]}</div><div class="lbl">${x[1]}</div></div>`).join("")}</div>
     <div class="count" id="cnt">0 of 3</div><div class="note" id="n">Vault restored</div>`,
   anim:()=>ring() },
 { part:"Part two: protecting what people carry", kicker:"The proof",
   h:"Her new school can verify her certificate.",
   p:"The registrar confirms, in seconds, that it is genuine and unchanged.",
   phone:()=>`<div class="bar">Registrar check</div>
     <div class="cert"><b>School Leaving Certificate</b><br>Student: Amal<br>Grade 11, 2026<br>Issued by: Ministry of Education (sample)</div>
     <div class="res ok" id="r"><b>Genuine and unchanged</b><p>Signed by the issuing school.</p></div>`,
   anim:()=>later("#r",1100) },

const DUR=[7000,8000,9000,9000,9000,9000,7000,10000,8000,10000];
let i=0,timer=null,paused=false;
const $=s=>document.querySelector(s), stage=$("#stage"), phone=$("#phone"), crack=$("#crack");
scenes.forEach(()=>$("#dots").appendChild(document.createElement("b")));
function render(){
  const s=scenes[i];
  stage.classList.toggle("blue",!!s.blue); document.body.classList.toggle("inv",!!s.blue); $("#rosBg").classList.toggle("on",!!s.blue);
  crack.classList.remove("in"); phone.style.transform="";
  $("#screen").innerHTML=s.phone();
  $("#part").textContent=s.part;
  $("#copy").innerHTML=`<div class="fade"><div class="kicker">${s.kicker}</div><h1>${s.h}</h1>${s.ar?`<div class="ar">${s.ar}</div>`:""}<p>${s.p}</p>${s.cta?`<div class="cta">${s.cta}</div>`:""}</div>`;
  [...$("#dots").children].forEach((d,k)=>d.classList.toggle("on",k<=i));
  if(s.anim) s.anim(); schedule();
}
function schedule(){clearTimeout(timer);if(!paused)timer=setTimeout(()=>go(1),DUR[i]);}
function go(d){i=(i+d+scenes.length)%scenes.length;render();}
function stagger(sel,ms){document.querySelectorAll(sel).forEach((el,k)=>setTimeout(()=>el.classList.add("in"),350+k*ms));}
function later(sel,ms){setTimeout(()=>{const e=$(sel);e&&e.classList.add("in")},ms);}
function hexRain(){const h=$("#hex"),c="0123456789abcdef";let n=0;const t=setInterval(()=>{if(!h.isConnected||n>480){clearInterval(t);return}for(let k=0;k<12;k++)h.textContent+=c[Math.random()*16|0];n+=12;},40);}
function ring(){const ps=document.querySelectorAll(".p");[0,2,4].forEach((k,j)=>setTimeout(()=>{if(!ps[k].isConnected)return;ps[k].classList.add("on");$("#cnt").textContent=(j+1)+" of 3";if(j===2)setTimeout(()=>{const n=$("#n");n&&n.classList.add("in")},500)},900+j*1300));}
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();go(1)}else if(e.key==="ArrowLeft")go(-1);else if(e.key.toLowerCase()==="f"){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}else if(e.key.toLowerCase()==="p"){paused=!paused;schedule()}});
document.addEventListener("click",()=>go(1));
